apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cafe-companion-ai
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containers:
      - image: gcr.io/PROJECT_ID/cafe-companion-ai:latest
        resources:
          limits:
            memory: 1Gi
            cpu: 1000m
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: latest
